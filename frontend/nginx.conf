# TickCart nginx 配置（容器内 /etc/nginx/conf.d/default.conf）
#
# 两个 server 块对应两个前端应用：
#   :80   商城 mall   —— 前端路由是 createWebHistory，需 try_files 回退到 index.html
#   :8081 后台 admin  —— 同上
# 两个块都把 /api 与 /img 反代到 backend 容器：
#   /api/**  REST 接口 + /api/files/** 上传图片（后端 StaticResourceConfig 的 url-prefix）
#   /img/**  仓库内演示图片（tickcart.static.imgs-dir）

upstream backend_upstream {
    server backend:8080;
    keepalive 32;
}

# ---------------------------------------------------------------------------
# 商城（80）
# ---------------------------------------------------------------------------
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html/mall;
    index index.html;

    # 后台上传单图上限 5MB（tickcart.upload.max-size-mb），这里留余量
    client_max_body_size 10m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # ^~ 必须有：否则 /img/xxx.jpg 会被下面的正则 location 抢走，
    # 去 mall 的 root 下找文件而 404
    location ^~ /api/ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location ^~ /img/ {
        proxy_pass http://backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 带 hash 的构建产物可长缓存
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpe?g|gif|webp|ico)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }

    # 入口 HTML 不缓存，保证发版后立刻拿到新的资源引用
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # history 模式兜底：/orders/xxx 这类深链刷新时交给前端路由
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ---------------------------------------------------------------------------
# 后台（8081）
# ---------------------------------------------------------------------------
server {
    listen 8081;
    server_name _;
    root /usr/share/nginx/html/admin;
    index index.html;

    client_max_body_size 10m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location ^~ /api/ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location ^~ /img/ {
        proxy_pass http://backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpe?g|gif|webp|ico)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
