name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-unit:
    name: 后端单元测试
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: 准备 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: 跑单元测试
        run: mvn -B test

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-unit
          path: backend/target/surefire-reports/
          if-no-files-found: ignore

  backend-integration:
    name: 后端集成测试
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: 准备 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: 跑集成测试
        run: mvn -B test -Dtest='*IT' -DfailIfNoTests=false

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-it
          path: backend/target/surefire-reports/
          if-no-files-found: ignore

  frontend:
    name: 前端类型检查与构建
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: 准备 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.9.1

      - name: 准备 Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 类型检查（mall）
        run: pnpm --filter mall exec vue-tsc --noEmit

      - name: 类型检查（admin）
        run: pnpm --filter admin exec vue-tsc --noEmit

      - name: 构建（mall）
        run: pnpm --filter mall exec vite build --emptyOutDir false

      - name: 构建（admin）
        run: pnpm --filter admin exec vite build --emptyOutDir false

  frontend-unit:
    name: 前端单元测试
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: 准备 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.9.1

      - name: 准备 Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 跑单元测试
        run: pnpm --filter mall test

  e2e:
    name: E2E（Playwright）
    runs-on: ubuntu-latest
    # E2E 需要真实的后端与中间件，所以这个 job 自己起一整套
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: tickcart
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
      rabbitmq:
        image: rabbitmq:3.13-management
        ports:
          - 5672:5672
        options: >-
          --health-cmd="rabbitmq-diagnostics -q ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4

      - name: 准备 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: 启动后端并等待就绪
        working-directory: backend
        env:
          MYSQL_PORT: '3307'
          SERVER_PORT: '8080'
        run: |
          nohup mvn -B spring-boot:run > /tmp/backend.log 2>&1 &
          echo "等待后端就绪（Flyway 迁移 + 上下文启动）..."
          for i in $(seq 1 90); do
            if curl -sf http://localhost:8080/api/health > /dev/null 2>&1; then
              echo "后端已就绪"
              exit 0
            fi
            sleep 2
          done
          echo "::error::后端启动超时，末尾日志："
          tail -120 /tmp/backend.log
          exit 1

      - name: 准备 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.9.1

      - name: 准备 Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: 安装前端依赖
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: 跑 E2E
        working-directory: frontend
        run: pnpm exec playwright test

      - name: 上传失败现场
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/test-results/
            frontend/playwright-report/
          if-no-files-found: ignore

      - name: 后端日志（失败时）
        if: failure()
        run: tail -200 /tmp/backend.log
