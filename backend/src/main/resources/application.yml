server:
  port: 8080

spring:
  application:
    name: tickcart-backend

  # ---------------------------------------------------------------------------
  # 数据源（本地开发默认值，可通过环境变量覆盖）
  # ---------------------------------------------------------------------------
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:tickcart}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:root}
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # ---------------------------------------------------------------------------
  # Flyway 数据库迁移
  # 迁移脚本位置：classpath:db/migration（V1__*.sql ...）
  # 已存在库自动迁移；校验和开启以防脚本被篡改
  # ---------------------------------------------------------------------------
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    encoding: UTF-8
    validate-on-migrate: true
    # 每次启动检查是否有新脚本，不清理已有数据
    clean-disabled: true

# -----------------------------------------------------------------------------
# MyBatis-Plus 配置
# -----------------------------------------------------------------------------
mybatis-plus:
  # Mapper XML 位置
  mapper-locations: classpath:mapper/*.xml
  # 实体扫描包
  type-aliases-package: com.tickcart.**.entity
  configuration:
    # 下划线字段名 → 驼峰属性名（created_at → createdAt）
    map-underscore-to-camel-case: true
    # 开发期打印 SQL，便于调试（生产可关闭）
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      # 主键自增策略
      id-type: auto
      # 逻辑删除字段与值
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# -----------------------------------------------------------------------------
# 日志
# -----------------------------------------------------------------------------
logging:
  level:
    com.tickcart: debug
