server:
  port: 8080
  tomcat:
    # 请求体被应用层拒绝（如上传超限）时，Tomcat 仍吞掉剩余字节，
    # 否则会直接断连，前端拿不到我们返回的 400 JSON
    max-swallow-size: -1
    threads:
      # 与 Hikari 的 20 个连接保持 5:1 —— 线程数远超连接数时，
      # 多出来的请求只会卡在「等连接」上，白白占着线程
      max: 100
      min-spare: 20

spring:
  application:
    name: tickcart-backend

  # ---------------------------------------------------------------------------
  # 数据源（本地开发默认值，可通过环境变量覆盖）
  # ---------------------------------------------------------------------------
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:tickcart}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:root}
    hikari:
      minimum-idle: 5
      # 单机部署 + MySQL 默认 max_connections=151，20 个连接留足余量
      maximum-pool-size: 20
      # 3 秒拿不到连接就快速失败：等 30 秒只会让请求线程一起堆积，
      # 用户等来的还是超时，不如尽早返回 500 让上游重试
      connection-timeout: 3000
      idle-timeout: 600000
      max-lifetime: 1800000

  # ---------------------------------------------------------------------------
  # 文件上传（后台商品图片）
  # 落盘目录与访问前缀见 tickcart.upload.*，静态映射见 StaticResourceConfig
  # ---------------------------------------------------------------------------
  servlet:
    multipart:
      # 硬上限（网络层兜底），业务上限见 tickcart.upload.max-size-mb
      max-file-size: 10MB
      max-request-size: 12MB

  # ---------------------------------------------------------------------------
  # Flyway 数据库迁移
  # 迁移脚本位置：classpath:db/migration（V1__*.sql ...）
  # 已存在库自动迁移；校验和开启以防脚本被篡改
  # ---------------------------------------------------------------------------
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    encoding: UTF-8
    validate-on-migrate: true
    # 每次启动检查是否有新脚本，不清理已有数据
    clean-disabled: true

  # ---------------------------------------------------------------------------
  # Redis（阶段1 仅建立连接；购物车/秒杀库存在后续阶段启用）
  # ---------------------------------------------------------------------------
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
      timeout: 3s

  # ---------------------------------------------------------------------------
  # RabbitMQ（阶段2 启用：订单超时延迟队列 + 死信关单）
  # 队列/交换机声明见 com.tickcart.common.mq.OrderMqConfig
  # ---------------------------------------------------------------------------
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    # 投递可靠性三件套，缺一则 return 回调不触发：
    #   publisher-confirm-type 让 Broker 回 ack/nack；publisher-returns 开启退回；
    #   template.mandatory 让「无匹配队列」的消息退回而不是被丢弃
    # 回调处理见 com.tickcart.common.mq.RabbitConfirmConfig
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        # 手动 ack：成功/重投/丢弃由 OrderTimeoutConsumer 自行决定
        acknowledge-mode: manual
        prefetch: 10

# -----------------------------------------------------------------------------
# TickCart 自定义配置
# -----------------------------------------------------------------------------
tickcart:
  jwt:
    # 生产环境务必通过环境变量覆盖（HS256 要求密钥 >= 32 字节）
    secret: ${JWT_SECRET:tickcart-dev-secret-key-please-change-in-production-0123456789}
    # access token 有效期（分钟）
    access-token-minutes: ${JWT_ACCESS_MINUTES:30}
    # refresh token 有效期（天）
    refresh-token-days: ${JWT_REFRESH_DAYS:7}
    issuer: tickcart
  # 登录频控与人机验证（防爆破 / 防撞库 / 防 BCrypt 打满 CPU）
  # 开发环境阈值偏宽，因为回归脚本会反复登录；生产按注释收紧
  login-guard:
    enabled: ${LOGIN_GUARD_ENABLED:true}
    # 失败计数窗口（分钟）
    fail-window-minutes: ${LOGIN_FAIL_WINDOW_MINUTES:15}
    # 窗口内失败达到该次数 → 要求图形验证码
    verify-threshold: ${LOGIN_VERIFY_THRESHOLD:3}
    # 窗口内失败达到该次数 → 锁定
    lock-threshold: ${LOGIN_LOCK_THRESHOLD:5}
    # 首轮锁定（分钟）
    lock-minutes: ${LOGIN_LOCK_MINUTES:15}
    # 24h 内第 2 轮锁定时长（分钟）
    escalate-lock-minutes: ${LOGIN_ESCALATE_LOCK_MINUTES:60}
    # 第 3 轮及以后的锁定上限（分钟）
    max-lock-minutes: ${LOGIN_MAX_LOCK_MINUTES:1440}
    # 阶梯轮次的记忆窗口（小时）
    escalate-window-hours: ${LOGIN_ESCALATE_WINDOW_HOURS:24}
    # 同 IP 窗口内失败多少次封禁 / 封禁多久（分钟）
    ip-fail-threshold: ${LOGIN_IP_FAIL_THRESHOLD:20}
    ip-lock-minutes: ${LOGIN_IP_LOCK_MINUTES:30}
    # 同 IP 登录接口每秒请求数（生产建议 5；开发放宽到 20 避免误伤并发回归脚本）
    ip-qps-limit: ${LOGIN_IP_QPS_LIMIT:20}
    # 图形码有效期（秒）与字符数
    captcha-expire-seconds: ${LOGIN_CAPTCHA_EXPIRE_SECONDS:300}
    captcha-length: 4
  # 模拟短信验证码：开发环境固定返回该验证码，便于联调（不接真实短信网关）
  # ★ 激活 prod/production profile 时若仍开着 mock，应用会启动失败（见 SmsMockGuard）
  sms:
    mock-enabled: ${SMS_MOCK_ENABLED:true}
    mock-code: ${SMS_MOCK_CODE:123456}
    # 验证码有效期（秒）
    code-expire-seconds: 300
    # 短信频控：发送侧防轰炸（直接花钱），校验侧防爆破（6 位码只有 100 万种）
    # 两侧必须同时生效，只做一侧都能被绕过
    guard:
      enabled: ${SMS_GUARD_ENABLED:true}
      # 同号两次发送的最小间隔（秒）
      send-interval-seconds: ${SMS_SEND_INTERVAL_SECONDS:30}
      # 同号在窗口内的发送次数上限
      send-window-minutes: ${SMS_SEND_WINDOW_MINUTES:10}
      send-window-limit: ${SMS_SEND_WINDOW_LIMIT:3}
      # 同号每日发送上限
      daily-limit: ${SMS_DAILY_LIMIT:10}
      # 同一个码最多允许错几次，达到即作废、需重新获取
      verify-fail-limit: ${SMS_VERIFY_FAIL_LIMIT:5}
  # 订单
  order:
    # 待付款订单自动关闭时限（毫秒），即 trade.order.timeout 队列的 TTL
    timeout-ttl-ms: ${ORDER_TIMEOUT_TTL_MS:900000}
  # 秒杀（3B）
  seckill:
    # 预热前瞻窗口（秒）：扫描「已开始或 N 秒内即将开始」的活动
    preload-lookahead-seconds: ${SECKILL_PRELOAD_LOOKAHEAD:60}
    # 预热定时任务间隔（毫秒）：兜住「上线时预热失败」的场景
    preload-interval-ms: ${SECKILL_PRELOAD_INTERVAL_MS:30000}
    # 建单消费者开关：压测时关掉，用来验证「抢购成功率不依赖 DB 写入速度」（B5 场景 S4）
    consumer-enabled: ${SECKILL_CONSUMER_ENABLED:true}
  # 商品
  product:
    # 随机分页的候选池上限：一次最多取多少个商品 id 到内存里洗牌。
    # 当前演示量级（647 个商品）远低于该值，开销 <1ms / 5KB；
    # 商品数超过 5000 或该接口 P95 > 50ms 时，应改为「权重列 + 游标翻页」，
    # 见 docs/读放大与可靠性收尾设计.md §4
    random-pool-limit: ${PRODUCT_RANDOM_POOL_LIMIT:2000}
  # 下单幂等（A1）：同一 (scene, user_id, 幂等键) 只成一次单
  idempotent:
    # 幂等记录保留时长（小时）：保留期内重复提交回放首次结果，过期后由定时任务清理
    retention-hours: ${IDEMPOTENT_RETENTION_HOURS:24}
    # 清理任务 cron（Spring 6 段式），默认每天 04:30，与 03:00 的搜索日志清理错开
    cleanup-cron: ${IDEMPOTENT_CLEANUP_CRON:0 30 4 * * ?}
  # 支付
  payment:
    # 模拟渠道的处理耗时（毫秒）：渠道受理后延迟多久才回调商城，即 trade.payment.notify 队列的 TTL
    # 调小它 = 收银台「正在确认支付结果…」的等待变短；但别调到 0，那样就看不到异步等待了
    notify-delay-ms: ${PAYMENT_NOTIFY_DELAY_MS:1000}
  # 图片上传（后台商品主图）
  upload:
    # 落盘根目录，相对路径以进程工作目录为基准（backend/ 下启动即 backend/uploads）
    dir: ${UPLOAD_DIR:uploads}
    # 对外访问前缀，须与 StaticResourceConfig 的映射一致
    url-prefix: /api/files
    # 单张图片大小上限（MB）
    max-size-mb: 5
  # 静态资源（随仓库提交的演示素材）
  static:
    # 演示图片目录，以 /img/** 对外提供；默认 ../imgs 指仓库根目录 imgs/
    imgs-dir: ${IMGS_DIR:../imgs}
  # 搜索
  search:
    # search_log 保留天数：早于「今天 - N 天」的搜索日志会被定时清理；<=0 表示不清理
    log-retention-days: ${SEARCH_LOG_RETENTION_DAYS:90}
    # 清理任务 cron（Spring 6 段式：秒 分 时 日 月 周），默认每天 03:00
    log-cleanup-cron: ${SEARCH_LOG_CLEANUP_CRON:0 0 3 * * ?}
    # 写入缓冲：请求线程只入队，定时批量落库（见 SearchLogBuffer）
    # 队列有界，满了丢弃并计数 —— 日志是统计素材，不能影响搜索主链路
    log-buffer-capacity: ${SEARCH_LOG_BUFFER_CAPACITY:10000}
    log-flush-batch-size: ${SEARCH_LOG_FLUSH_BATCH:200}
    log-flush-interval-ms: ${SEARCH_LOG_FLUSH_INTERVAL_MS:1000}
  # 读缓存（A2）：商品详情 / 分类列表 / 热搜词
  # key 规范与失效策略见 docs/商品缓存设计.md
  cache:
    # 总开关：关掉后所有读写直接回源，用于排查「是不是缓存导致的」
    enabled: ${CACHE_ENABLED:true}
    # 商品详情 TTL（秒）：详情含库存，太长会显示过期库存
    product-detail-ttl-seconds: ${CACHE_PRODUCT_DETAIL_TTL:60}
    # 分类列表 TTL（秒）：分类极少变动
    category-list-ttl-seconds: ${CACHE_CATEGORY_LIST_TTL:1800}
    # 热搜词 TTL（秒）：太短等于没缓存，太长失去时效
    hot-words-ttl-seconds: ${CACHE_HOT_WORDS_TTL:300}
    # 空值标记 TTL（秒）：防穿透
    null-ttl-seconds: ${CACHE_NULL_TTL:60}
    # TTL 随机抖动百分比，避免同一时刻批量过期造成雪崩
    ttl-jitter-percent: ${CACHE_TTL_JITTER:10}
  # 接口限流（A3）：令牌桶，阈值可配，未列出的接口不限流
  # 设计见 docs/接口限流设计.md；压测/并发验证时置 RATE_LIMIT_ENABLED=false
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    rules:
      # 商品与分类：已加缓存，成本低；一屏页面会连发数个请求，阈值给宽
      - name: product-read
        patterns: ["/api/products/**", "/api/categories/**"]
        methods: ["GET"]
        dimension: IP
        permits: 60
        window-seconds: 1
      # 搜索：每次 LIKE 全表 + 同步写 search_log，是最贵的读接口
      - name: search
        patterns: ["/api/search/**"]
        methods: ["GET"]
        dimension: IP
        permits: 10
        window-seconds: 1
      # 秒杀前台：B1 只有列表/详情，阈值先给宽；抢购接口（B2）必须另配独立规则，
      # 绝不能复用本条 —— 抢购流量本来就该被 MQ 削峰
      - name: seckill-read
        patterns: ["/api/seckill/**"]
        methods: ["GET"]
        dimension: IP
        permits: 30
        window-seconds: 1
      # 抢购：独立规则，绝不复用 seckill-read 的 30/s —— 抢购流量本就该被
      # Redis 原子扣减 + MQ 削峰，限流只用来挡脚本连点
      - name: seckill-buy
        patterns: ["/api/seckill/*/order"]
        methods: ["POST"]
        dimension: USER
        permits: 5
        window-seconds: 1
      # 下单：幂等只管「同一请求不重复」，管不了「换幂等键狂下单」
      - name: order-create
        patterns: ["/api/orders", "/api/orders/buy-now"]
        methods: ["POST"]
        dimension: USER
        permits: 5
        window-seconds: 1
      # 发起支付：要落流水 + 投 MQ
      - name: payment
        patterns: ["/api/payments/**"]
        methods: ["POST"]
        dimension: USER
        permits: 5
        window-seconds: 1

# -----------------------------------------------------------------------------
# MyBatis-Plus 配置
# -----------------------------------------------------------------------------
mybatis-plus:
  # Mapper XML 位置
  mapper-locations: classpath:mapper/*.xml
  # 实体扫描包
  type-aliases-package: com.tickcart.**.entity
  configuration:
    # 下划线字段名 → 驼峰属性名（created_at → createdAt）
    map-underscore-to-camel-case: true
    # 开发期打印 SQL，便于调试（生产可关闭）
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      # 主键自增策略
      id-type: auto
      # 逻辑删除字段与值
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# -----------------------------------------------------------------------------
# 日志
# -----------------------------------------------------------------------------
logging:
  level:
    com.tickcart: debug
