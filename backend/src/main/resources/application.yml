server:
  port: 8080

spring:
  application:
    name: tickcart-backend

  # ---------------------------------------------------------------------------
  # 数据源（本地开发默认值，可通过环境变量覆盖）
  # ---------------------------------------------------------------------------
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:tickcart}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:root}
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # ---------------------------------------------------------------------------
  # Flyway 数据库迁移
  # 迁移脚本位置：classpath:db/migration（V1__*.sql ...）
  # 已存在库自动迁移；校验和开启以防脚本被篡改
  # ---------------------------------------------------------------------------
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    encoding: UTF-8
    validate-on-migrate: true
    # 每次启动检查是否有新脚本，不清理已有数据
    clean-disabled: true

  # ---------------------------------------------------------------------------
  # Redis（阶段1 仅建立连接；购物车/秒杀库存在后续阶段启用）
  # ---------------------------------------------------------------------------
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
      timeout: 3s

# -----------------------------------------------------------------------------
# TickCart 自定义配置
# -----------------------------------------------------------------------------
tickcart:
  jwt:
    # 生产环境务必通过环境变量覆盖（HS256 要求密钥 >= 32 字节）
    secret: ${JWT_SECRET:tickcart-dev-secret-key-please-change-in-production-0123456789}
    # access token 有效期（分钟）
    access-token-minutes: ${JWT_ACCESS_MINUTES:30}
    # refresh token 有效期（天）
    refresh-token-days: ${JWT_REFRESH_DAYS:7}
    issuer: tickcart
  # 模拟短信验证码：开发环境固定返回该验证码，便于联调（不接真实短信网关）
  sms:
    mock-enabled: ${SMS_MOCK_ENABLED:true}
    mock-code: ${SMS_MOCK_CODE:123456}
    # 验证码有效期（秒）
    code-expire-seconds: 300

# -----------------------------------------------------------------------------
# MyBatis-Plus 配置
# -----------------------------------------------------------------------------
mybatis-plus:
  # Mapper XML 位置
  mapper-locations: classpath:mapper/*.xml
  # 实体扫描包
  type-aliases-package: com.tickcart.**.entity
  configuration:
    # 下划线字段名 → 驼峰属性名（created_at → createdAt）
    map-underscore-to-camel-case: true
    # 开发期打印 SQL，便于调试（生产可关闭）
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      # 主键自增策略
      id-type: auto
      # 逻辑删除字段与值
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# -----------------------------------------------------------------------------
# 日志
# -----------------------------------------------------------------------------
logging:
  level:
    com.tickcart: debug
